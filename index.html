<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A1120">
<meta name="release-date" content="2026-10-27">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="업무">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>업무허브 V1.05 (2026-10-27)</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
:root{--bg:#0A1120;--panel:#0F182A;--panel-2:#0B1322;--panel-3:#131F36;--border:#1C2842;--soft:#162137;--text:#E6ECF5;--dim:#8E9AB0;--faint:#5F6B82;--glow:#5EEAD4;--amber:#F5A524;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:'Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif;font-size:15px;-webkit-font-smoothing:antialiased}
body{background:radial-gradient(900px 420px at 50% -8%,#142242 0%,var(--bg) 60%) fixed,var(--bg);padding-bottom:calc(24px + env(safe-area-inset-bottom))}
button,input,textarea{font-family:inherit;color:inherit}button{cursor:pointer}[hidden]{display:none!important}
.num{font-family:'JetBrains Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.top{position:sticky;top:0;z-index:6;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:rgba(10,17,32,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
.top-in,main{max-width:560px;margin:0 auto}
.brand{display:flex;align-items:center;gap:8px}.brand b{font-size:20px;font-weight:900}.brand b span{color:var(--glow)}
.chip{min-height:28px;padding:0 10px;border-radius:99px;border:1px solid var(--border);background:var(--panel-2);color:var(--faint);font-size:11.5px;font-weight:700}
.chip.ok{color:var(--glow);border-color:rgba(94,234,212,.4)}.chip.err{color:var(--amber);border-color:rgba(245,165,36,.45)}
.ver{margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:11.5px;font-weight:700;color:var(--glow);border:1px solid rgba(94,234,212,.4);background:rgba(94,234,212,.08);border-radius:8px;padding:3px 8px}
main{padding:14px 14px 24px;display:grid;gap:12px}
.ch{display:flex;align-items:center;gap:8px;margin-bottom:10px}.ch h2{margin:0;font-size:16px;font-weight:800}.ch small{margin-left:auto;font-size:11.5px;color:var(--faint)}
.imp{border:1.5px dashed rgba(94,234,212,.5);border-radius:18px;padding:14px;background:rgba(94,234,212,.04)}
.imp.hl{animation:hl 1.2s ease-in-out 3}@keyframes hl{50%{box-shadow:0 0 0 4px rgba(94,234,212,.35)}}
.two2{display:grid;grid-template-columns:3fr 2fr;gap:8px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:14px;padding:15px 8px;font-size:15px;font-weight:800;background:linear-gradient(90deg,#2BCDB8,#5EEAD4);color:#04211C;text-decoration:none}
.btn.ghost{background:var(--panel-3);color:var(--text);border:1px solid var(--border)}
.btn.line{background:none;border:1.5px solid var(--border);color:var(--dim)}
.res{font-size:12.5px;color:var(--dim);margin-top:10px;line-height:1.7}.res b{color:var(--text)}.res a{color:var(--glow);font-weight:700;text-decoration:none;margin-right:10px}
.app{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:16px;border-radius:18px;background:linear-gradient(180deg,var(--panel),#0D1525);border:1px solid var(--border);color:inherit;text-decoration:none}
.app:active{transform:scale(.99)}
.app .ic{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;font-size:24px;background:var(--panel-3);border:1px solid var(--border)}
.app .tx{min-width:0}.app b{display:block;font-size:17px;font-weight:800}.app small{display:block;font-size:12.5px;color:var(--dim);margin-top:3px;line-height:1.55}.app small b{display:inline;font-size:12.5px;color:var(--text)}
.app .go{font-size:24px;color:var(--glow)}
.card{background:linear-gradient(180deg,var(--panel),#0D1525);border:1px solid var(--border);border-radius:18px;padding:14px}
.sub{font-size:12.5px;color:var(--dim);line-height:1.7}.sub b{color:var(--text)}
.steps{margin:8px 0 0;padding-left:20px;font-size:12.5px;color:var(--dim);line-height:1.8}.steps b{color:var(--text)}
.vfoot{text-align:center;font-size:11.5px;color:var(--faint)}
.ov{position:fixed;inset:0;background:rgba(3,7,15,.6);display:none;align-items:flex-end;z-index:20}.ov.on{display:flex}
.sheet{background:var(--panel);border:1px solid var(--border);border-bottom:0;width:100%;max-width:560px;margin:0 auto;border-radius:22px 22px 0 0;padding:14px 16px calc(14px + env(safe-area-inset-bottom));display:grid;gap:8px}
.sheet h3{margin:0 0 4px;font-size:18px}
textarea{width:100%;min-height:160px;border-radius:12px;border:1.5px solid var(--border);background:var(--panel-2);font-family:'JetBrains Mono',monospace;font-size:12.5px;padding:10px;outline:none}
.pl{max-height:30vh;overflow:auto;margin-top:6px;font-size:12.5px;line-height:1.7;border-top:1px solid var(--border);padding-top:6px}
.toast{position:fixed;left:50%;bottom:calc(30px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#0F2A2A;color:var(--glow);border:1px solid rgba(94,234,212,.4);padding:10px 18px;border-radius:99px;font-size:13px;font-weight:700;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30;max-width:92vw;text-align:center}
.toast.on{opacity:1}
</style>
</head>
<body>
<div class="top"><div class="top-in">
  <div class="brand"><b>업무<span>허브</span></b><button class="chip" id="syncChip" type="button" hidden></button><span class="ver" id="hdrVer"></span></div>
</div></div>
<main>
  <section class="imp" id="impBox">
    <div class="ch"><h2>💳 카드 내역 올리기</h2><small>가계부 + 업무일지 자동</small></div>
    <div class="two2"><button class="btn" type="button" data-imp>📂 엑셀 올리기</button><button class="btn ghost" type="button" data-paste>📋 붙여넣기</button></div>
    <div class="res" id="impRes"></div>
  </section>
  <a class="app" href="worklog.html"><span class="ic">📅</span><span class="tx"><b>업무일지</b><small id="sLog"></small></span><span class="go">›</span></a>
  <a class="app" href="expenses.html"><span class="ic">💰</span><span class="tx"><b>가계부</b><small id="sExp"></small></span><span class="go">›</span></a>
  <section class="card" id="install">
    <div class="ch"><h2>📲 홈 화면에 설치</h2></div>
    <button class="btn ghost" type="button" id="insBtn">📲 홈 화면에 ‘업무’ 아이콘 만들기</button>
    <ol class="steps" id="insSteps" hidden></ol>
  </section>
  <div class="sub" id="syncLine"></div>
  <div class="vfoot" id="vFoot"></div>
</main>
<div class="ov" id="pOv"><div class="sheet">
  <h3>📋 복사한 내역 붙여넣기</h3>
  <div class="sub">카드사 앱·문자·홈페이지 어디서 복사해도 됩니다. <b>날짜 · 가맹점 · 금액</b>만 들어 있으면 줄 모양과 상관없이 읽고, 반영 전에 읽은 내용을 보여줍니다.</div>
  <textarea id="pText" spellcheck="false" placeholder="2026.08.24	17:32:05	선단IC주유소	242,459	일시불"></textarea>
  <div class="res" id="pPrev"></div>
  <button class="btn" type="button" id="pGo">읽고 반영하기</button>
  <button class="btn line" type="button" id="pCancel">닫기</button>
</div></div>
<input type="file" id="file" accept=".xlsx,.csv,.txt,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,text/csv,text/plain" hidden>
<div class="toast" id="toast"></div>

<script src="mod-base.js?v=1.05-2026-10-27"></script>
<script src="mod-card.js?v=1.05-2026-10-27"></script>
<script src="mod-sync.js?v=1.05-2026-10-27"></script>
<script src="mod-ledger.js?v=1.05-2026-10-27"></script>
<script>
const {$,bus,escH,fmt,keyOf,metaOf,rj,toast}=M.base;
const {pasteTx,readCardFile}=M.card;
const sync=M.sync;
const {E,EK,EM,WK,allTx,catOf,importCore,importMsg,replaceE,sumV,ymKey}=M.ledger;
/* ================= 버전 정보 (하드코딩) =================
   V1.05 (2026-10-27): 대리점 카드에 전화번호로 지도 여는 버튼(번호지도) 추가
   V1.04 (2026-10-27): 입력란에서 로그인 자동입력창이 뜨지 않게 처리
   V1.03 (2026-10-27): 서울 구 순서 고정: 노원·도봉·강북·성북·중랑·동대문·광진
   V1.02 (2026-10-27): 권역 안에서 시·구 단위로 묶고 거리순→이름순 정렬, 서울 구 주소에 시·도 자동 보완
   V1.01 (2026-10-27): 주소 자동 정리(시·도 보완, 층·호수 삭제), 주소 자동 찾기, 서울권 주소 추가, 버튼 눌림 효과
   V1.00 (2026-10-26): 버전 새로 시작 — 업무허브 — 카드 엑셀·붙여넣기 올리기(형식 자유·미리보기), 업무일지·가계부 이동, 이번 달 요약
   구조: 공통 코드는 독립 모듈(mod-*.js)로 분리, 이 파일은 화면만 담당 */
const APP_NAME    = '업무허브';
const APP_VERSION = '1.05';
const BUILD_DATE  = '2026-10-27';
sync.configure({version:APP_VERSION});

/* 예전 주소(WORK/#log 등)로 들어오면 업무일지로 */
if(/^#(log|year|dist|more)$/.test(location.hash)) location.replace('worklog.html'+location.hash);

/* ---- 요약 ---- */
function renderLog(){
  const W=rj(WK,{}), t=new Date();
  let y=t.getFullYear(), m=t.getMonth(); if(t.getDate()>=25){ m++; if(m>11){ m=0; y++; } }   // 근무 기간: 전월 25일 ~ 당월 24일
  const s0=keyOf(new Date(y,m-1,25)), e0=keyOf(new Date(y,m,24));
  let work=0, rounds=0, cost=0;
  Object.keys(W).forEach(k=>{ if(k<s0||k>e0) return; const r=W[k]||{}; if(['1','2','3'].includes(r.s)) work++; if(r.r) rounds+=Object.keys(r.r).length; cost+=(+r.fuel||0)+(+r.toll||0)+(+r.urea||0); });
  $('sLog').innerHTML=`${m+1}월 근무 <b>${work}일</b> · 회전 기록 <b>${rounds}회</b> · 비용 <b class="num">${fmt(cost)}원</b><br>대리점 조회 · 회전 저장 · 근무 달력`;
}
function renderExp(){
  const T=allTx(); if(!T.length){ $('sExp').innerHTML='아직 지출 기록이 없습니다<br>카드 엑셀을 올리면 자동으로 정리됩니다'; return; }
  let mo=ymKey(new Date()); if(!T.some(r=>r.d.startsWith(mo))) mo=T.map(r=>r.d).sort().pop().slice(0,7);   // 이번 달이 비면 가장 최근 달
  const M=T.filter(r=>r.d.startsWith(mo)), c=k=>sumV(M.filter(r=>catOf(r)===k));
  $('sExp').innerHTML=`${+mo.slice(5)}월 지출 <b class="num">${fmt(sumV(M))}원</b><br>생활 <b class="num">${fmt(c('life'))}</b> · 업무 <b class="num">${fmt(c('work'))}</b> · 기타 <b class="num">${fmt(c('etc'))}</b>`;
}
function renderImp(){
  const L=rj('expenses.lastImport',null);
  $('impRes').innerHTML=L?`마지막 반영: <b>${escH(L.src)}</b> · ${L.from.slice(5).replace('-','/')}~${L.to.slice(5).replace('-','/')} · 읽음 <b>${L.read??L.add+L.dup}건</b> → 새 결제 <b>${L.add}건</b>${L.dup?` · 이미 있음 ${L.dup}건`:''}${L.skip?` · 지운 결제 ${L.skip}건`:''}${L.miss?` · <b style="color:var(--amber)">⚠ 못 읽은 줄 ${L.miss}개</b> (원본 엑셀 확인)`:''} · 업무일지 <b>${L.days}일</b><br><a href="expenses.html">가계부에서 보기 ›</a><a href="worklog.html#log">업무일지에서 보기 ›</a>`
    :'삼성카드 앱 → 이용내역 → <b>엑셀 저장</b>한 파일이나 복사한 내역을 올리면, 모든 결제는 가계부에, 주유·요소수·통행료는 업무일지 비용에 들어갑니다. 원본도 평생 보관됩니다.';
}
function renderAll(){ replaceE(rj(EK,E)); renderImp(); renderLog(); renderExp(); uiSync(); }

/* ---- 올리기 (엑셀 · 붙여넣기) ---- */
function afterImport(res){ toast(importMsg(res)); renderAll(); sync.now(); }
document.addEventListener('click',e=>{ if(e.target.closest('[data-imp]')) $('file').click(); if(e.target.closest('[data-paste]')) openP(); });
$('file').onchange=async e=>{ const f=e.target.files[0]; e.target.value=''; if(!f) return;
  try{ const {tx,rows,miss}=await readCardFile(f); afterImport(importCore(tx,f.name,rows,miss)); }catch(err){ toast('⚠ '+(err.message||'파일을 읽지 못했습니다')); } };
function openP(){ $('pOv').classList.add('on'); setTimeout(()=>$('pText').focus(),150); }
function closeP(){ $('pOv').classList.remove('on'); }
function pPreview(){        // 붙여넣는 즉시 읽은 결과를 보여주고, 확인 후 반영
  const t=$('pText').value||'', r=t.trim()?pasteTx(t):{tx:[]}, n=r.tx.length;
  $('pGo').textContent=n?`${n}건 반영하기`:'읽고 반영하기';
  $('pPrev').innerHTML=!t.trim()?'':n?`<b>${n}건</b> 읽음 · 합계 <b class="num">${fmt(r.tx.reduce((s,x)=>s+x.v,0))}원</b> — 가맹점·금액이 맞는지 확인하세요<div class="pl">`+r.tx.slice(0,40).map(x=>`<div><span class="num">${x.k.slice(5).replace('-','/')}${x.tm?' '+x.tm:''}</span> ${escH(x.m)} <b class="num">${fmt(x.v)}</b></div>`).join('')+(n>40?`<div>… 외 ${n-40}건</div>`:'')+'</div>':'⚠ 날짜와 금액을 찾지 못했습니다. 날짜(예: 2026.09.09 · 9/9 · 9월 9일)와 금액(예: 16,000원)이 들어간 부분을 함께 복사하세요.';
  return r;
}
let pT=0; $('pText').addEventListener('input',()=>{ clearTimeout(pT); pT=setTimeout(pPreview,250); });
$('pGo').onclick=()=>{ const {tx,rows}=pPreview();
  if(!tx.length){ toast('⚠ 날짜·가맹점·금액을 찾지 못했습니다'); return; }
  closeP(); $('pText').value=''; pPreview();
  afterImport(importCore(tx,'붙여넣기 '+new Date().toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}),rows)); };
$('pCancel').onclick=closeP;
$('pOv').onclick=e=>{ if(e.target.id==='pOv') closeP(); };

/* ---- 동기화 표시 (mod-sync.js가 알림) ---- */
function uiSync(state){
  const on=!!(sync.isOn()), chip=$('syncChip'), m=metaOf(EM);
  chip.hidden=!on; chip.className='chip';
  if(!on){ $('syncLine').innerHTML='☁ 동기화 꺼짐 · 이 기기에만 저장 중 — <a href="worklog.html#more" style="color:var(--glow)">업무일지 → 더보기</a>에서 연결하면 업무일지·가계부가 함께 PC·폰에 저장됩니다'; return; }
  if(state==='busy'){ chip.textContent='☁ 동기화 중'; return; }
  if(sync.err()){ chip.classList.add('err'); chip.textContent='☁ 확인 필요'; $('syncLine').textContent='⚠ '+sync.err(); return; }
  chip.classList.add('ok'); chip.textContent='☁ 동기화됨';
  $('syncLine').innerHTML=`☁ 업무일지 · 가계부 동기화 켜짐 · 마지막 ${m.last?new Date(m.last).toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}):'-'}`;
}
function uiChanged(){ renderAll(); }
bus.on('sync:state',uiSync); bus.on('data:changed',uiChanged);
$('syncChip').onclick=()=>sync.now();

/* ---- 홈 화면 설치 ---- */
let deferredPrompt=null;
const IS_IOS=/iPhone|iPad|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
if(window.matchMedia('(display-mode: standalone)').matches||navigator.standalone===true) $('install').hidden=true;
window.addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); deferredPrompt=e; });
window.addEventListener('appinstalled',()=>{ $('install').hidden=true; toast('✅ 홈 화면에 ‘업무’ 아이콘이 생겼습니다'); });
$('insBtn').onclick=async()=>{
  if(deferredPrompt){ const p=deferredPrompt; deferredPrompt=null; try{ p.prompt(); await p.userChoice; }catch(e){} return; }
  const s=$('insSteps'); s.hidden=!s.hidden;
  s.innerHTML=IS_IOS?'<li><b>사파리</b>로 이 주소를 엽니다</li><li>공유 버튼 <b>□↑</b> → <b>홈 화면에 추가</b></li><li><b>웹 앱으로 열기</b>는 끈 채로 두면 사파리의 기록을 그대로 씁니다</li>'
    :'<li><b>크롬</b> 오른쪽 위 <b>⋮</b> → <b>홈 화면에 추가</b> 또는 <b>앱 설치</b></li><li><b>삼성 인터넷</b> 아래 <b>≡</b> → <b>현재 페이지 추가</b> → <b>홈 화면</b></li>';
};

/* ---- 자동 업데이트 ---- */
let lastChk=0;
async function checkUpdate(){
  if(!/^https?:$/.test(location.protocol)||Date.now()-lastChk<15000) return; lastChk=Date.now();
  try{
    const h=await (await fetch('index.html?check='+Date.now(),{cache:'no-store'})).text();
    const v=(h.match(/APP_VERSION\s*=\s*'([^']+)'/)||[])[1], d=(h.match(/BUILD_DATE\s*=\s*'([^']+)'/)||[])[1];
    const mt=(h.match(/mod-base\.js\?v=([\w.\-]+)/)||[])[1], cm=(document.querySelector('script[src^="mod-base.js"]')||{}).src||'';      // 모듈만 바뀐 업데이트도 알아챔
    if(!v||(v===APP_VERSION&&d===BUILD_DATE&&(!mt||cm.includes(mt)))) return;
    let tried=null; try{ tried=sessionStorage.getItem('hub.updTried'); }catch(e){}
    if(!$('pOv').classList.contains('on')&&tried!==v+d+(mt||'')){ try{ sessionStorage.setItem('hub.updTried',v+d+(mt||'')); }catch(e){} location.reload(); }
  }catch(e){}
}
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(()=>{});

/* ---- 시작 ---- */
$('hdrVer').textContent=`V${APP_VERSION}`;
$('vFoot').textContent=`시스템 버전: 업무허브 V${APP_VERSION} (${BUILD_DATE})`;
renderAll();
if(location.hash==='#paste') openP();
if(location.hash==='#import'){ $('impBox').classList.add('hl'); toast('📂 엑셀 올리기 또는 붙여넣기를 누르세요'); }
sync.schedule(400);
